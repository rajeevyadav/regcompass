# ============================================================
# RegCompass — Windows release build
# ------------------------------------------------------------
# Runs automatically whenever you push a version tag, e.g.:
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
# It builds the Windows installer (RegCompass-Setup-x.y.z.exe)
# and the portable exe, then attaches both to a GitHub Release
# for that tag. No secrets to configure — it uses the built-in
# GITHUB_TOKEN.
# ============================================================

name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # also allows manual runs from the Actions tab

permissions:
  contents: write         # needed to create the GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and publish Windows exe
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

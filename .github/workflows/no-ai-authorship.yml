# Guardrail: commits must be authored solely by the maintainer. No AI assistant
# authorship or co-author trailers (Claude, ChatGPT/OpenAI, Copilot, Gemini,
# Cursor, Codeium, etc.). Fails the build if a pushed commit carries an AI
# author/committer identity or an AI Co-Authored-By / Generated-with trailer.
name: No AI authorship

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  scan-authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject AI authorship / co-author trailers
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git rev-parse "$BEFORE" >/dev/null 2>&1; then
            RANGE="$BEFORE..${{ github.sha }}"
          else
            RANGE="HEAD~1..HEAD"
          fi
          # Author/committer identity must not be an AI assistant / AI provider.
          IDENT='anthropic\.com|openai\.com|noreply@anthropic|(^|[^a-z])(claude|chatgpt|copilot|codeium|cursor ai)([^a-z]|$)|github-copilot'
          if git log "$RANGE" --format='%an <%ae>%n%cn <%ce>' | grep -Ei "$IDENT"; then
            echo "::error::A commit author/committer is an AI assistant/provider identity. Commits must be authored solely by the maintainer."
            exit 1
          fi
          # Co-author / generated-with trailers naming an AI tool are forbidden.
          TRAILER='co-authored-by:[[:space:]]*(claude|anthropic|openai|chatgpt|gpt-|copilot|gemini|bard|cursor|codeium)|generated with[[:space:]]+(\[?claude|chatgpt|openai|copilot|gemini|cursor|codeium)|noreply@anthropic|anthropic\.com|openai\.com'
          if git log "$RANGE" --format='%B' | grep -Ei "$TRAILER"; then
            echo "::error::A commit carries an AI co-author / generated-with trailer. Remove AI attribution."
            exit 1
          fi
          echo "No AI authorship/co-author metadata in the pushed commits."

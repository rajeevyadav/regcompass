# ============================================================
# "No embedded AI" guard
# ------------------------------------------------------------
# RegCompass's core promise is that it contains no AI/ML code,
# no embedded copilot/chatbot, and no calls to an AI API. This
# workflow fails the build if any future commit accidentally
# introduces one of those — a dependency, a comment referencing
# an AI coding assistant left in by mistake, or a call to a
# known AI-provider API endpoint.
#
# This is a lightweight guardrail, not a legal certification —
# it catches obvious slips, not disguised code.
# ============================================================

name: No embedded AI check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan app/build source for AI-provider or AI-assistant references
        run: |
          set -e
          # Only scan the files that actually ship / run — not docs that are
          # allowed to *talk about* AI (e.g. the EU AI Act module, README).
          TARGETS="js/app.js electron/main.js scripts/make-www.js sw.js package.json capacitor.config.json"
          PATTERN='openai\.com|anthropic\.com|api\.anthropic|copilot|chatgpt|claude-[a-z0-9-]*\.(js|json)|@anthropic-ai|@openai|langchain|tensorflow|onnxruntime|huggingface'
          HIT=0
          for f in $TARGETS; do
            if [ -f "$f" ] && grep -EinH "$PATTERN" "$f"; then
              HIT=1
            fi
          done
          if [ "$HIT" -eq 1 ]; then
            echo "::error::Found a reference to an AI provider/assistant/ML library in shipped app or build code. RegCompass must stay AI-free in its runtime and toolchain."
            exit 1
          fi
          echo "Clean — no embedded AI/ML references found in shipped code."

      - name: Check no AI/ML runtime dependencies were added
        run: |
          set -e
          if [ -f package.json ]; then
            if grep -EiqL '"(openai|@anthropic-ai|langchain|@tensorflow|onnxruntime-node|@huggingface)"' package.json 2>/dev/null; then
              :
            fi
            if grep -Ei '"(openai|@anthropic-ai/[a-z-]*|langchain|@tensorflow/[a-z-]*|onnxruntime-node|@huggingface/[a-z-]*)"[[:space:]]*:' package.json; then
              echo "::error::An AI/ML package is listed as a dependency in package.json. RegCompass ships no AI/ML runtime dependencies."
              exit 1
            fi
          fi
          echo "package.json has no AI/ML dependencies."
